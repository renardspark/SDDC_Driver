name: CMake

on:
  # Trigger the workflow on push (all branches) or pull request (master only)
  # but only for the main branch
  push:
  pull_request:
    branches:
      - master

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

jobs:
  build-firmware:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    name: build-firmware

    steps:
    - uses: actions/checkout@v7

    - name: Install libs
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi

    - name: Build firmware
      shell: bash
      run: make -C ./SDDC_FX3

    - uses: actions/upload-artifact@v7
      with:
        path: ./SDDC_FX3/SDDC_FX3.img
        archive: false

  build-on-windows:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-2025
    needs: build-firmware
    continue-on-error: true
    strategy:
      matrix:
        include:
          - arch: x86
            cmake_args: -A Win32
            vcpkg_triplet: x86-windows
          - arch: x86_64
            cmake_args: -A x64
            vcpkg_triplet: x64-windows

    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: SDDC_FX3.img

    - name: Install vcpkg dependencies
      run: cd c:\vcpkg ; git pull ; vcpkg install soapysdr:${{matrix.vcpkg_triplet}}

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      working-directory: ${{runner.workspace}}/build
      # Note the current convention is to use the -S and -B options here to specify source
      # and build directories, but this is only available with CMake 3.13 and higher.
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" -G "Visual Studio 18 2026" ${{matrix.cmake_args}}

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE

    - name: Install FFTW3
      working-directory: ${{runner.workspace}}/build
      shell: powershell
      run: Invoke-WebRequest -Uri "ftp://ftp.fftw.org/pub/fftw/fftw-3.3.5-dll32.zip" -OutFile fftw-3.3.5-dll32.zip

    - name: Unzip FFTW3
      working-directory: ${{runner.workspace}}/build
      shell: powershell
      run: Expand-Archive -Path .\fftw-3.3.5-dll32.zip -DestinationPath unittest

    - name: Create Package
      shell: powershell
      run: Compress-Archive -DestinationPath SDDC_EXTIO.ZIP -LiteralPath ${{runner.workspace}}/build/ExtIO_sddc/Release/ExtIO_SDDC.dll,${{runner.workspace}}/build/unittest/libfftw3f-3.dll,README.md

    - uses: actions/upload-artifact@v7
      with:
        name: ExtIO_Windows_${{matrix.arch}}
        path: SDDC_EXTIO.ZIP

    - uses: actions/upload-artifact@v7
      with:
        name: ExtIO_Windows_${{matrix.arch}}.dll
        path: ${{runner.workspace}}/build/ExtIO_sddc/Release/ExtIO_SDDC.dll

    - working-directory: ${{runner.workspace}}/build/SoapySDDC/Release/
      shell: bash
      run: mv SDDCSupport.dll SoapySDDC_Windows_${{matrix.arch}}.dll
    - uses: actions/upload-artifact@v7
      with:
        path: ${{runner.workspace}}/build/SoapySDDC/Release/SoapySDDC_Windows_${{matrix.arch}}.dll
        archive: false

    - working-directory: ${{runner.workspace}}/build/sddc-cli/Release/
      shell: bash
      run: mv sddc-cli.exe sddc-cli_Windows_${{matrix.arch}}.exe
    - uses: actions/upload-artifact@v7
      with:
        path: ${{runner.workspace}}/build/sddc-cli/Release/sddc-cli_Windows_${{matrix.arch}}.exe
        archive: false

  build-on-linux:
    needs: build-firmware
    runs-on: ${{ matrix.os }}
    name: build-on-linux-${{matrix.arch}}
    continue-on-error: true
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-26.04-arm
            arch: arm64
    steps:
    - uses: actions/checkout@v7

    - uses: actions/download-artifact@v8
      with:
        name: SDDC_FX3.img

    - name: Install libs
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libusb-1.0-0-dev libsoapysdr-dev

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{runner.workspace}}/build

    - name: Configure CMake
      # Use a bash shell so we can use the same syntax for environment variable
      # access regardless of the host operating system
      shell: bash
      run: cmake -S $GITHUB_WORKSPACE -B ${{runner.workspace}}/build -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{runner.workspace}}/build
      shell: bash
      # Execute tests defined by the CMake configuration.
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C $BUILD_TYPE

    - working-directory: ${{runner.workspace}}/build/SoapySDDC/
      shell: bash
      run: mv libSDDCSupport.so SoapySDDC_Linux_${{matrix.arch}}.so
    - uses: actions/upload-artifact@v7
      with:
        path: ${{runner.workspace}}/build/SoapySDDC/SoapySDDC_Linux_${{matrix.arch}}.so
        archive: false

    - working-directory: ${{runner.workspace}}/build/sddc-cli/
      shell: bash
      run: mv sddc-cli sddc-cli_Linux_${{matrix.arch}}
    - uses: actions/upload-artifact@v7
      with:
        path: ${{runner.workspace}}/build/sddc-cli/sddc-cli_Linux_${{matrix.arch}}
        archive: false

  build-on-macos:
    needs: build-firmware
    runs-on: ${{ matrix.os }}
    name: build-on-macos-${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - os: macos-15-intel
            arch: x86_64
          - os: macos-latest
            arch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: SDDC_FX3.img

      - name: Install dependencies
        run: |
          brew update
          brew install soapysdr
          brew install fftw

      - name: Configure and Install SoapySDR Module
        shell: bash
        working-directory: ${{ runner.workspace }}
        run: |
          set -euo pipefail
          build_dir="${{ runner.workspace }}/build-${{ matrix.arch }}"
          install_dir="${{ runner.workspace }}/install/${{ matrix.arch }}"
          mkdir -p "${build_dir}"
          cd "${build_dir}"
          cmake $GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_INSTALL_PREFIX="${install_dir}"
          cmake --build . --config $BUILD_TYPE --target install

      - name: Package SoapySDR Module
        shell: bash
        run: |
          install_dir="${{ runner.workspace }}/install/${{ matrix.arch }}"
          archive="SoapySDDC_MacOS_${{ matrix.arch }}.zip"
          if [ -d "${install_dir}" ]; then
            # Create the archive from inside the install dir so the archive
            # contains the module files without the leading install/... path.
            (cd "${install_dir}" && zip -r "${{ runner.workspace }}/${archive}" .)
          else
            echo "Install dir not found: ${install_dir}" >&2
            exit 1
          fi

      - name: Upload SoapySDR Package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.workspace }}/SoapySDDC_MacOS_${{ matrix.arch }}.zip
          archive: false

      - working-directory: ${{runner.workspace}}/build-${{ matrix.arch }}/sddc-cli/
        shell: bash
        run: mv sddc-cli sddc-cli_MacOS_${{matrix.arch}}
      - uses: actions/upload-artifact@v7
        with:
          path: ${{runner.workspace}}/build-${{ matrix.arch }}/sddc-cli/sddc-cli_MacOS_${{matrix.arch}}
          archive: false
